name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:pack
      - name: Production collector E2E using published npm SDK
        if: matrix.node == 24 && (github.ref == 'refs/heads/verify/prod-telemetry-e2e-20260920' || github.head_ref == 'verify/prod-telemetry-e2e-20260920')
        shell: bash
        env:
          E2E_CLIENT: ${{ matrix.os }}
          COLLECTOR_URL: https://telemetry-peach.vercel.app
        run: |
          rm -rf .e2e-consumer
          mkdir .e2e-consumer
          cd .e2e-consumer
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @nyn5255/telemetry@0.1.2
          cp ../scripts/prod-e2e-live.mjs ./prod-e2e-live.mjs
          node ./prod-e2e-live.mjs
